[project]
name = "satellite-key-management"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Stepan Shipilov", email = "s.shipilov@1440.space" }
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "imageio[ffmpeg]>=2.38.0",
    "kaleido>=1.5.1",
    "matplotlib>=3.10.9",
    "moviepy>=1.0.3",
    "numpy>=2.2.6",
    "pillow>=12.3.0",
    "plotly>=7.1.0",
]

[project.optional-dependencies]
analysis = ["pandas>=2.2"]

[project.scripts]
satellite-key-management = "satellite_key_management.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
